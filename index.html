<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예약케이크 관리</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2b2220;--mu:#7a6e6a;--bd:#e8dfda;--pr:#c2410c;--prt:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#fdeee6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1514;--card:#262020;--tx:#f3ece9;--mu:#a89c97;--bd:#3a3130;--pr:#f08a56;--prt:#1a1514;--ok:#4ade80;--bad:#f87171;--soft:#33241d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
header{display:flex;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0 12px 0 0}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:4px}
input,select,button.b{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
button.b{cursor:pointer;background:var(--pr);color:var(--prt);border-color:var(--pr)}
button.g{background:var(--card);color:var(--tx);border-color:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cake{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:44px}
.ph img{width:100%;height:100%;object-fit:cover}
.in{padding:10px;display:flex;flex-direction:column;gap:6px}
.nm{font-weight:700}.pr{color:var(--mu)}
.st{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:4px;font-size:12px;color:var(--mu)}
.st b{display:block;font-size:17px;color:var(--tx)}
.low b.r{color:var(--bad)}
.row{display:flex;gap:6px;align-items:center}
.row input{width:100%}
.msg{padding:8px 10px;border-radius:8px;font-size:14px;margin-top:8px}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.msg.no{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mu)}
tr.done td{color:var(--mu);text-decoration:line-through}
tr.done td:last-child,tr.done td:nth-child(1){text-decoration:none}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pr)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(380px,92vw)}
dialog form{display:flex;flex-direction:column;gap:10px}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit}
.mu{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<header><h1>🎂 예약케이크 관리</h1>
<nav><button id="t1">재고 관리</button> <button id="t2">예약 목록</button></nav></header>
<main id="app"></main>

<dialog id="dlg"><form id="f" method="dialog">
<b id="dt">케이크 추가</b>
<label>사진<input type="file" id="fi" accept="image/*"></label>
<label>이름<input id="fn" required></label>
<label>가격(원)<input id="fp" type="number" min="0" inputmode="numeric"></label>
<div class="row"><button class="b g" type="button" id="fc">취소</button><button class="b" type="submit">저장</button></div>
</form></dialog>

<script>
var APPS=["해피앱","파바앱","카카오","요기요","배달의민족","현장"];
var DATES=[["2026-12-21","12/21(월)"],["2026-12-22","12/22(화)"],["2026-12-23","12/23(수)"],["2026-12-24","12/24(목)"],["2026-12-25","12/25(금)"]];
var D={cakes:[],orders:[]};
function load(){try{var s=localStorage.getItem("cakeD");if(s)D=JSON.parse(s)}catch(e){}
 if(!D.cakes||!D.cakes.length){D.cakes=["생크림 케이크","딸기 케이크","초코 케이크","치즈 케이크","티라미수 케이크","고구마 케이크","망고 케이크","레드벨벳 케이크","당근 케이크","말차 케이크"].map(function(n,i){return{id:"c"+i,name:n,price:25000,img:"",stock:0}});D.orders=[]}}
function save(){try{localStorage.setItem("cakeD",JSON.stringify(D))}catch(e){alert("저장 공간이 부족합니다. 사진 크기를 줄여 주세요.")}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rsv(id){return D.orders.filter(function(o){return o.cakeId===id}).reduce(function(a,o){return a+o.qty},0)}
function rem(c){return c.stock-rsv(c.id)}
function won(n){return Number(n||0).toLocaleString("ko-KR")+"원"}
function cake(id){return D.cakes.find(function(c){return c.id===id})}
var page=location.hash==="#orders"?2:1,q="",fs="all",editId=null,imgData="";

function render(){
 t1.className=page===1?"on":"";t2.className=page===2?"on":"";
 app.innerHTML=page===1?p1():p2();
}
function p1(){
 var opts=D.cakes.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("");
 var h='<div class="box"><b>재고 확인</b> <span class="mu">· 예약 받을 때 수량을 입력해 가능 여부를 바로 확인</span><div class="bar" style="margin:10px 0 0"><label>케이크<select id="qc">'+opts+'</select></label><label>예약 수량<input id="qq" type="number" min="1" value="1" style="width:90px"></label><button class="b" onclick="chk()">확인</button></div><div id="qm"></div></div>';
 h+='<div class="bar"><b>케이크 목록 ('+D.cakes.length+'종)</b><button class="b" onclick="openD()">+ 케이크 추가</button></div><div class="grid">';
 D.cakes.forEach(function(c){var r=rem(c);
  h+='<div class="cake"><div class="ph">'+(c.img?'<img src="'+c.img+'" alt="">':'🎂')+'</div><div class="in"><div class="nm">'+esc(c.name)+'</div><div class="pr">'+won(c.price)+'</div>'+
  '<label>취합 수량(총 입고)<input type="number" min="0" value="'+c.stock+'" onchange="setStock(\''+c.id+'\',this.value)"></label>'+
  '<div class="st '+(r<=0?"low":"")+'"><span>취합<b>'+c.stock+'</b></span><span>예약<b>'+rsv(c.id)+'</b></span><span>잔여<b class="r">'+r+'</b></span></div>'+
  '<div class="row"><button class="b g" onclick="openD(\''+c.id+'\')">수정</button><button class="b g" onclick="delC(\''+c.id+'\')">삭제</button></div></div></div>'});
 return h+'</div>';
}
function p2(){
 var opts=D.cakes.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+' (잔여 '+rem(c)+')</option>'}).join("");
 var h='<div class="box"><b>예약 등록</b><div class="bar" style="margin:10px 0 0"><label>수령일<select id="od">'+DATES.map(function(d){return'<option value="'+d[0]+'">'+d[1]+'</option>'}).join("")+'</select></label><label>케이크<select id="oc">'+opts+'</select></label><label>수량<input id="oq" type="number" min="1" value="1" style="width:70px"></label><label>주문 앱<select id="oa">'+APPS.map(function(a){return'<option>'+a+'</option>'}).join("")+'</select></label><label>뒷번호 4자리<input id="op" maxlength="4" inputmode="numeric" style="width:100px"></label><button class="b" onclick="addO()">등록</button></div><div id="om"></div></div>';
 h+='<div class="bar"><label>핸드폰 뒷번호 검색<input id="sq" value="'+esc(q)+'" maxlength="4" inputmode="numeric" placeholder="예: 1234" oninput="q=this.value;list()"></label><label>수령 상태<select onchange="fs=this.value;list()"><option value="all">전체</option><option value="n"'+(fs==="n"?" selected":"")+'>미수령</option><option value="y"'+(fs==="y"?" selected":"")+'>수령완료</option></select></label></div>';
 return h+'<div class="box wrap" id="lst"></div>';
}
function list(){
 var el=document.getElementById("lst");if(!el)return;
 var a=D.orders.filter(function(o){return(!q||o.phone.indexOf(q)>-1)&&(fs==="all"||(fs==="y")===o.done)}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0});
 var h='<table><thead><tr><th>수령</th><th>수령일</th><th>케이크</th><th>수량</th><th>주문 앱</th><th>뒷번호</th><th></th></tr></thead><tbody>';
 a.forEach(function(o){var c=cake(o.cakeId);
  h+='<tr class="'+(o.done?"done":"")+'"><td><input type="checkbox" '+(o.done?"checked":"")+' onchange="tog(\''+o.id+'\',this.checked)"></td><td>'+o.date+'</td><td>'+esc(c?c.name:"(삭제됨)")+'</td><td>'+o.qty+'</td><td>'+esc(o.app)+'</td><td>'+esc(o.phone)+'</td><td><button class="x" onclick="delO(\''+o.id+'\')">삭제</button></td></tr>'});
 if(!a.length)h+='<tr><td colspan="7" class="mu">표시할 예약이 없습니다.</td></tr>';
 el.innerHTML=h+'</tbody></table>';
}
function setStock(id,v){cake(id).stock=Math.max(0,parseInt(v)||0);save();render()}
function chk(){var c=cake(qc.value),n=parseInt(qq.value)||0,r=c?rem(c):0;
 qm.innerHTML=n<1?'<div class="msg no">수량을 입력해 주세요.</div>':n<=r?'<div class="msg ok">예약 가능 · 잔여 '+r+'개 → 예약 후 '+(r-n)+'개</div>':'<div class="msg no">재고 부족 · 잔여 '+r+'개, '+(n-r)+'개 모자랍니다.</div>'}
function addO(){var c=cake(oc.value),n=parseInt(oq.value)||0,p=op.value.trim();
 function m(t,ok){om.innerHTML='<div class="msg '+(ok?"ok":"no")+'">'+t+'</div>'}
 if(!c)return m("케이크를 선택해 주세요.");
 if(!od.value)return m("수령일을 입력해 주세요.");
 if(n<1)return m("수량을 입력해 주세요.");
 if(!/^\d{4}$/.test(p))return m("핸드폰 뒷번호 4자리를 입력해 주세요.");
 if(n>rem(c))return m("재고 부족 · 잔여 "+rem(c)+"개입니다.");
 D.orders.push({id:"o"+Date.now(),date:od.value,cakeId:c.id,qty:n,app:oa.value,phone:p,done:false});
 save();var d=od.value,a=oa.value;render();od.value=d;oa.value=a;om.innerHTML='<div class="msg ok">예약이 등록되었습니다. 재고 관리의 예약·잔여 수량에 반영됩니다.</div>';list()}
function tog(id,v){D.orders.find(function(o){return o.id===id}).done=v;save();list()}
function delO(id){if(confirm("이 예약을 삭제할까요? (재고가 복구됩니다)")){D.orders=D.orders.filter(function(o){return o.id!==id});save();render();list()}}
function delC(id){if(rsv(id)>0)return alert("예약이 있는 케이크는 삭제할 수 없습니다.");if(confirm("케이크를 삭제할까요?")){D.cakes=D.cakes.filter(function(c){return c.id!==id});save();render()}}
function openD(id){editId=id||null;imgData=id?cake(id).img:"";dt.textContent=id?"케이크 수정":"케이크 추가";fn.value=id?cake(id).name:"";fp.value=id?cake(id).price:"";fi.value="";dlg.showModal()}
fc.onclick=function(){dlg.close()};
fi.onchange=function(){var f=fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,400/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);imgData=cv.toDataURL("image/jpeg",.75)};im.src=r.result};r.readAsDataURL(f)};
f.onsubmit=function(){var n=fn.value.trim();if(!n)return;
 if(editId){var c=cake(editId);c.name=n;c.price=parseInt(fp.value)||0;c.img=imgData}
 else D.cakes.push({id:"c"+Date.now(),name:n,price:parseInt(fp.value)||0,img:imgData,stock:0});
 save();render()};
t1.onclick=function(){page=1;location.hash="";render()};
t2.onclick=function(){page=2;location.hash="orders";render();list()};
load();render();if(page===2)list();
</script>
</body>
</html>
